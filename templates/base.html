{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Nocturne Tasks{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/nocturne.css' %}?v=3">
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <a href="{% url 'index' %}" class="logo">Nocturne Tasks</a>

        <nav class="nav">
            <a href="{% url 'index' %}">Главная</a>

            {% if user.is_authenticated %}
                <a href="{% url 'task_list' %}">Задачи</a>
                <a href="{% url 'task_create' %}">Добавить</a>

                {% if user.is_staff %}
                    <a href="/admin/">Админка</a>
                {% endif %}

                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Вход</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="main">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="footer">
    <div class="container">
        <span>Django · SQLite · Todo List</span>
    </div>
</footer>

</body>
</html>
