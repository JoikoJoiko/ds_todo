{% extends 'base.html' %}

{% block title %}Удаление — Nocturne Tasks{% endblock %}

{% block content %}

<section class="card">
    <p class="label">Delete</p>
    <h1>Удалить задачу?</h1>

    <p>«{{ task.title }}» будет удалена без восстановления.</p>

    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="btn danger">Удалить</button>
        <a href="{% url 'task_detail' task.pk %}" class="btn">Отмена</a>
    </form>
</section>

{% endblock %}
